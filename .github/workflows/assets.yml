name: Assets
# Récupère un pack de modèles 3D libres de droits (CC0) de Quaternius depuis sa page itch.io officielle
# (téléchargement gratuit), convertit chaque glTF en GLB optimisé et les ajoute à la branche dans assets-src/.
on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Page itch.io du pack"
        default: https://quaternius.itch.io/universal-base-characters
      match:
        description: "Motif du fichier à prendre (ex. Standard)"
        default: Standard
      only:
        description: "Motif des chemins glTF à convertir (regex, vide = tous)"
        default: ""
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Téléchargement gratuit itch.io
        env: { PACK: "${{ inputs.pack }}", MATCH: "${{ inputs.match }}" }
        run: |
          set -e
          J=/tmp/cookies.txt; UA="Mozilla/5.0 (X11; Linux x86_64)"
          page=$(curl -sL -c $J -b $J -A "$UA" "$PACK")
          csrf=$(echo "$page" | grep -oE 'name="csrf_token" value="[^"]+"' | head -1 | sed 's/.*value="//;s/"$//')
          dl=$(curl -sL -c $J -b $J -A "$UA" -X POST -d "csrf_token=$csrf" "$PACK/download_url" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("url",""))')
          [ -n "$dl" ] || exit 1
          curl -sL -c $J -b $J -A "$UA" "$dl" -o /tmp/dl.html
          csrf2=$(grep -oE 'name="csrf_token" value="[^"]+"' /tmp/dl.html | head -1 | sed 's/.*value="//;s/"$//')
          python3 - "$MATCH" > /tmp/uploads.txt <<'PY'
          import sys,re
          html=open("/tmp/dl.html",encoding="utf8").read(); m=sys.argv[1].lower(); seen=[]
          for uid in re.findall(r'data-upload_id="(\d+)"', html):
              if uid in seen: continue
              seen.append(uid); i=html.find(f'data-upload_id="{uid}"'); chunk=html[max(0,i-1500):i+1500]
              names=re.findall(r'class="name"[^>]*title="([^"]+)"', chunk); name=names[0] if names else "?"
              print(uid, name.replace(" ","_"), "*" if m in name.lower() else "")
          PY
          echo "── fichiers proposés :"; cat /tmp/uploads.txt
          uid=$(grep '\*$' /tmp/uploads.txt | head -1 | cut -d' ' -f1)
          [ -n "$uid" ] || uid=$(head -1 /tmp/uploads.txt | cut -d' ' -f1)
          resp=$(curl -s -c $J -b $J -A "$UA" -e "$dl" -H "X-Requested-With: XMLHttpRequest" -X POST -d "csrf_token=$csrf2" "$PACK/file/$uid?source=view_game&as_props=1&after_download_lightbox=true")
          file=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("url",""))')
          [ -n "$file" ] || { echo "$resp" | head -c 300; exit 1; }
          curl -sL -A "$UA" -o /tmp/pack.zip "$file"
          ls -la /tmp/pack.zip
          mkdir -p /tmp/pack && unzip -q /tmp/pack.zip -d /tmp/pack
          echo "── arborescence :"
          (cd /tmp/pack && find . -type d | sort | head -120)
          echo "── modèles :"
          (cd /tmp/pack && find . \( -iname '*.gltf' -o -iname '*.glb' \) | sort)
      - name: Conversion GLB optimisée
        env: { PACK: "${{ inputs.pack }}", ONLY: "${{ inputs.only }}" }
        run: |
          set -e
          slug=$(basename "$PACK")
          out="assets-src/$slug"; mkdir -p "$out"
          (cd /tmp/pack && find . \( -iname '*.gltf' -o -iname '*.glb' \) | sort) > /tmp/models.txt
          if [ -n "$ONLY" ]; then grep -E "$ONLY" /tmp/models.txt > /tmp/m2.txt || true; mv /tmp/m2.txt /tmp/models.txt; fi
          echo "── à convertir :"; cat /tmp/models.txt
          echo "── tree" > "$out/LISTE.txt"; (cd /tmp/pack && find . -type f | sort) >> "$out/LISTE.txt"
          while read -r f; do
            name=$(echo "$f" | sed 's#^\./##; s#[^A-Za-z0-9._-]#_#g; s#\.gltf$##i; s#\.glb$##i')
            npx -y @gltf-transform/cli@4 optimize "/tmp/pack/$f" "$out/$name.glb" --compress meshopt --texture-compress webp --texture-size 1024 --simplify false > /tmp/log.txt 2>&1 \
              || { echo "optimize a échoué pour $f :"; tail -15 /tmp/log.txt; npx -y @gltf-transform/cli@4 copy "/tmp/pack/$f" "$out/$name.glb" 2>&1 | tail -5 || echo "échec : $f"; }
          done < /tmp/models.txt
          du -sh "$out"; ls -la "$out" | head -80
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-src
          git commit -m "Modèles 3D CC0 Quaternius : $(basename "${{ inputs.pack }}") (GLB optimisés)" || exit 0
          git push
