name: Assets
# Récupère les modèles 3D libres de droits (CC0) de Quaternius depuis sa page itch.io officielle
# (téléchargement gratuit « No thanks, just take me to the downloads »), puis les publie en artefact.
on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Page itch.io du pack"
        default: https://quaternius.itch.io/universal-base-characters
      match:
        description: "Motif du fichier à prendre (ex. Standard)"
        default: Standard
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement gratuit itch.io
        env: { PACK: "${{ inputs.pack }}", MATCH: "${{ inputs.match }}" }
        run: |
          set -e
          J=cookies.txt; UA="Mozilla/5.0 (X11; Linux x86_64)"
          page=$(curl -sL -c $J -b $J -A "$UA" "$PACK")
          csrf=$(echo "$page" | grep -oE 'name="csrf_token" value="[^"]+"' | head -1 | sed 's/.*value="//;s/"$//')
          echo "csrf: ${csrf:0:6}…"
          dl=$(curl -sL -c $J -b $J -A "$UA" -X POST -d "csrf_token=$csrf" "$PACK/download_url" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("url",""))')
          echo "page de téléchargement : $dl"
          [ -n "$dl" ] || exit 1
          curl -sL -c $J -b $J -A "$UA" "$dl" -o dl.html
          csrf2=$(grep -oE 'name="csrf_token" value="[^"]+"' dl.html | head -1 | sed 's/.*value="//;s/"$//')
          python3 - "$MATCH" > uploads.txt <<'PY'
          import sys,re
          html=open("dl.html",encoding="utf8").read(); m=sys.argv[1].lower()
          ids=re.findall(r'data-upload_id="(\d+)"', html)
          seen=[]
          for uid in ids:
              if uid in seen: continue
              seen.append(uid)
              i=html.find(f'data-upload_id="{uid}"')
              chunk=html[max(0,i-1500):i+1500]
              names=re.findall(r'class="name"[^>]*title="([^"]+)"', chunk) or re.findall(r'<strong[^>]*class="name"[^>]*>([^<]+)<', chunk)
              name=names[0] if names else "?"
              print(uid, name.replace(" ","_"), "*" if m in name.lower() else "")
          PY
          echo "── fichiers proposés :"; cat uploads.txt
          [ -s uploads.txt ] || { grep -o 'upload[^ ]\{0,80\}' dl.html | head -20; exit 1; }
          uid=$(grep '\*$' uploads.txt | head -1 | cut -d' ' -f1)
          [ -n "$uid" ] || uid=$(head -1 uploads.txt | cut -d' ' -f1)
          key=$(echo "$dl" | sed -E 's#.*/download/([^?]+).*#\1#')
          base=$(echo "$PACK" | grep -oE 'https://[^/]+')
          resp=$(curl -sL -c $J -b $J -A "$UA" -H "X-Requested-With: XMLHttpRequest" -X POST -d "csrf_token=$csrf2" "$base/file/$uid?source=game_download&key=$key")
          echo "réponse : ${resp:0:200}"
          file=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("url",""))')
          [ -n "$file" ] || exit 1
          curl -sL -A "$UA" -o pack.zip "$file"
          ls -la pack.zip
          mkdir -p pack && unzip -q pack.zip -d pack
          echo "── contenu (glTF/GLB) :"
          find pack -iname '*.gltf' -o -iname '*.glb' | head -60
          find pack -iname '*.gltf' -o -iname '*.glb' -o -iname '*.bin' -o -iname '*.png' | grep -iE 'gltf|glb' | head -200 > list.txt || true
          mkdir -p out && find pack \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.bin' \) -exec cp --parents {} out/ \;
          find pack -ipath '*gltf*' -iname '*.png' -exec cp --parents {} out/ \; || true
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: quaternius-gltf
          path: out
          retention-days: 7
